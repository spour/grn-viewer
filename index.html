<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRN viewer</title>
<style>
:root { --ink: #1d2330; --muted: #5b6475; --line: #dfe3ea; --bg: #fbfbfc; --card: #fff; --accent: #1f5fbf;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ink: #e6e9ef; --muted: #a3abba; --line: #2f3542; --bg: #14171d; --card: #1b1f27; --accent: #7aa7ff; } }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.55 var(--f); color: var(--ink); background: var(--bg); }
header, main, footer { max-width: 860px; margin: 0 auto; padding: 0 24px; }
header { padding-top: 56px; padding-bottom: 8px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.01em; }
h2 { font-size: 19px; margin: 40px 0 10px; }
p { margin: 0 0 12px; } .lede { color: var(--muted); font-size: 18px; max-width: 62ch; }
a { color: var(--accent); }
.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 20px 22px; margin: 24px 0 8px; transition: border-color .15s; }
.card:hover, .card:focus-visible { border-color: var(--accent); }
.card h3 { margin: 0 0 6px; font-size: 20px; color: var(--accent); }
.card .go { font-weight: 600; color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; padding: 0; list-style: none; }
.tags li { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0 12px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; } td.n { font-variant-numeric: tabular-nums; }
ol li, ul li { margin-bottom: 6px; }
.note { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); font-size: 15px; }
.refs li { font-size: 14px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; padding-top: 32px; padding-bottom: 48px; border-top: 1px solid var(--line); margin-top: 48px; }
</style>
</head>
<body>
<main id="grn-content"></main>
<script src="gate.js"></script>
<script>
fetch("landing.enc", { cache: "no-store" }).then((r) => r.arrayBuffer()).then(grnDecrypt)
  .then((b) => { document.getElementById("grn-content").outerHTML = new TextDecoder().decode(b); })
  .catch((e) => { document.getElementById("grn-content").textContent = e.message; });
</script>
<!-- grn-gate -->
</body>
</html>
